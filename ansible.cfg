[defaults]
remote_tmp = /tmp/vpn-ansible-admin
local_tmp = /tmp/vpn-ansible-local
inventory = inventory.ini
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
[ssh_connection]
ssh_args = -F /dev/null -o StrictHostKeyChecking=yes -o UpdateHostKeys=no -o ControlMaster=auto -o ControlPersist=60s
control_path_dir = /tmp/vpn-ansible-cp
